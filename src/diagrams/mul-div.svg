<svg viewBox="0 0 740 300" xmlns="http://www.w3.org/2000/svg" style="min-width:600px">
<rect class="d-box-3" x="160" y="20" width="90" height="40" rx="0"/>
<rect class="d-box-2" x="290" y="20" width="110" height="40" rx="0"/>
<rect class="d-box-a" x="440" y="20" width="200" height="40" rx="0"/>
<rect class="d-box-3" x="160" y="80" width="90" height="40" rx="0"/>
<rect class="d-box-2" x="290" y="80" width="110" height="40" rx="0"/>
<rect class="d-box-a" x="440" y="80" width="100" height="40" rx="0"/>
<rect class="d-box-a" x="540" y="80" width="100" height="40" rx="0"/>
<rect class="d-box-3" x="160" y="160" width="90" height="40" rx="0"/>
<rect class="d-box-2" x="290" y="160" width="110" height="40" rx="0"/>
<rect class="d-box" x="440" y="160" width="120" height="40" rx="0"/>
<rect class="d-box-a" x="560" y="160" width="120" height="40" rx="0"/>
<rect class="d-box-3" x="160" y="220" width="90" height="40" rx="0"/>
<rect class="d-box-2" x="290" y="220" width="110" height="40" rx="0"/>
<rect class="d-box" x="440" y="220" width="120" height="40" rx="0"/>
<rect class="d-box-a" x="560" y="220" width="120" height="40" rx="0"/>
<text class="d-caps" x="20" y="40.0" text-anchor="start" dominant-baseline="central">MUL byte</text>
<text class="d-mono" x="205" y="40.0" text-anchor="middle" dominant-baseline="central">AL</text>
<text class="d-title" x="270" y="40.0" text-anchor="middle" dominant-baseline="central">×</text>
<text class="d-mono" x="345" y="40.0" text-anchor="middle" dominant-baseline="central">r/m8</text>
<text class="d-title" x="420" y="40.0" text-anchor="middle" dominant-baseline="central">→</text>
<text class="d-mono d-on-accent" x="540" y="40.0" text-anchor="middle" dominant-baseline="central">AX = product</text>
<text class="d-caps" x="20" y="100.0" text-anchor="start" dominant-baseline="central">MUL word</text>
<text class="d-mono" x="205" y="100.0" text-anchor="middle" dominant-baseline="central">AX</text>
<text class="d-title" x="270" y="100.0" text-anchor="middle" dominant-baseline="central">×</text>
<text class="d-mono" x="345" y="100.0" text-anchor="middle" dominant-baseline="central">r/m16</text>
<text class="d-title" x="420" y="100.0" text-anchor="middle" dominant-baseline="central">→</text>
<text class="d-mono d-on-accent" x="490" y="100.0" text-anchor="middle" dominant-baseline="central">DX</text>
<text class="d-mono d-on-accent" x="590" y="100.0" text-anchor="middle" dominant-baseline="central">AX</text>
<text class="d-caps" x="20" y="180.0" text-anchor="start" dominant-baseline="central">DIV byte</text>
<text class="d-mono" x="205" y="180.0" text-anchor="middle" dominant-baseline="central">AX</text>
<text class="d-title" x="270" y="180.0" text-anchor="middle" dominant-baseline="central">÷</text>
<text class="d-mono" x="345" y="180.0" text-anchor="middle" dominant-baseline="central">r/m8</text>
<text class="d-title" x="420" y="180.0" text-anchor="middle" dominant-baseline="central">→</text>
<text class="d-mono" x="500" y="180.0" text-anchor="middle" dominant-baseline="central">AH = rem.</text>
<text class="d-mono d-on-accent" x="620" y="180.0" text-anchor="middle" dominant-baseline="central">AL = quot.</text>
<text class="d-caps" x="20" y="240.0" text-anchor="start" dominant-baseline="central">DIV word</text>
<text class="d-mono" x="205" y="240.0" text-anchor="middle" dominant-baseline="central">DX:AX</text>
<text class="d-title" x="270" y="240.0" text-anchor="middle" dominant-baseline="central">÷</text>
<text class="d-mono" x="345" y="240.0" text-anchor="middle" dominant-baseline="central">r/m16</text>
<text class="d-title" x="420" y="240.0" text-anchor="middle" dominant-baseline="central">→</text>
<text class="d-mono" x="500" y="240.0" text-anchor="middle" dominant-baseline="central">DX = rem.</text>
<text class="d-mono d-on-accent" x="620" y="240.0" text-anchor="middle" dominant-baseline="central">AX = quot.</text>
<text class="d-small" x="440" y="140.0" text-anchor="start" dominant-baseline="central">high word in DX · low word in AX</text>
<text class="d-small" x="20" y="286.0" text-anchor="start" dominant-baseline="central">IMUL / IDIV use the same registers for signed numbers. Clear DX (or CWD) before a word division.</text>
</svg>
