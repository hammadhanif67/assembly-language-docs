<svg viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg">
  <text class="d-small" x="20" y="20">highest priority</text>
  <text class="d-small" x="620" y="20" text-anchor="end">lowest priority</text>
  <g class="d-mono" text-anchor="middle" style="font-size:15px">
    <rect class="d-box-a" x="20" y="34" width="100" height="50" rx="8"/><text x="70" y="64" style="fill:var(--on-accent);font-weight:700">TRAP</text>
    <rect class="d-box-3" x="150" y="34" width="100" height="50" rx="8"/><text x="200" y="64">RST 7.5</text>
    <rect class="d-box-3" x="280" y="34" width="100" height="50" rx="8"/><text x="330" y="64">RST 6.5</text>
    <rect class="d-box-3" x="410" y="34" width="100" height="50" rx="8"/><text x="460" y="64">RST 5.5</text>
    <rect class="d-box" x="540" y="34" width="80" height="50" rx="8"/><text x="580" y="64">INTR</text>
