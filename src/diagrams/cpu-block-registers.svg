  <rect x="336" y="270" width="168" height="54" style="fill:#ffc000;stroke:#333"/><text x="420" y="293" text-anchor="middle" style="fill:#111;font-family:var(--font-body);font-size:13.5px">Memory Address</text><text x="420" y="311" text-anchor="middle" style="fill:#111;font-family:var(--font-body);font-size:13.5px">Register</text>
