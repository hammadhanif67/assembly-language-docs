  <rect class="d-box-a" x="56" y="226" width="168" height="44" style="fill:#ffc000;stroke:#333"/><text x="140" y="245" text-anchor="middle" style="fill:#111;font-family:var(--font-body);font-size:13px">Current Instruction</text><text x="140" y="262" text-anchor="middle" style="fill:#111;font-family:var(--font-body);font-size:13px">Register</text>
