  <rect x="56" y="348" width="168" height="44" style="fill:#ffc000;stroke:#333"/><text x="140" y="376" text-anchor="middle" style="fill:#111;font-family:var(--font-body)">Accumulator</text>
  <rect class="d-box" x="320" y="150" width="200" height="200" style="stroke:var(--d-accent-2);stroke-width:3"/>
