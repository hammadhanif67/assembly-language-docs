<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg">
  <rect class="d-box-2" x="200" y="10" width="160" height="50"/><text class="d-title" x="280" y="42" text-anchor="middle">OUTPUT</text>
  <line class="d-line d-arrow" style="stroke-width:4" x1="280" y1="102" x2="280" y2="64"/>
  <rect class="d-box" x="20" y="104" width="520" height="320" style="fill:var(--d-fill-3)"/>
  <text class="d-title" x="280" y="128" text-anchor="middle">Central Processing Unit (CPU)</text>
  <rect class="d-box" x="40" y="142" width="200" height="140" style="stroke:var(--d-accent-3);stroke-width:3"/>
  <text class="d-title" x="140" y="166" text-anchor="middle">Control Unit</text>
