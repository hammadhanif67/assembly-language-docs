<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <text class="d-small" x="140" y="22" text-anchor="middle">Flags<tspan baseline-shift="sub" font-size="9">H</tspan> (bits 15–8)</text>
  <text class="d-small" x="460" y="22" text-anchor="middle">Flags<tspan baseline-shift="sub" font-size="9">L</tspan> (bits 7–0)</text>
  <g class="d-mono" text-anchor="middle" style="font-size:12px">
    <rect class="d-box" x="20" y="30" width="40" height="34"/><text x="40" y="52">X</text>
    <rect class="d-box" x="60" y="30" width="40" height="34"/><text x="80" y="52">X</text>
    <rect class="d-box" x="100" y="30" width="40" height="34"/><text x="120" y="52">X</text>
    <rect class="d-box" x="140" y="30" width="40" height="34"/><text x="160" y="52">X</text>
    <rect class="d-box-3" x="180" y="30" width="40" height="34"/><text x="200" y="52">OF</text>
    <rect class="d-box-2" x="220" y="30" width="40" height="34"/><text x="240" y="52">DF</text>
    <rect class="d-box-2" x="260" y="30" width="40" height="34"/><text x="280" y="52">IF</text>
    <rect class="d-box-2" x="300" y="30" width="40" height="34"/><text x="320" y="52">TF</text>
    <rect class="d-box-3" x="340" y="30" width="40" height="34"/><text x="360" y="52">SF</text>
    <rect class="d-box-3" x="380" y="30" width="40" height="34"/><text x="400" y="52">ZF</text>
    <rect class="d-box" x="420" y="30" width="40" height="34"/><text x="440" y="52">X</text>
    <rect class="d-box-3" x="460" y="30" width="40" height="34"/><text x="480" y="52">AF</text>
    <rect class="d-box" x="500" y="30" width="40" height="34"/><text x="520" y="52">X</text>
    <rect class="d-box-3" x="540" y="30" width="40" height="34"/><text x="560" y="52">PF</text>
    <rect class="d-box" x="580" y="30" width="40" height="34"/><text x="600" y="52">X*</text>
    <rect class="d-box-3" x="620" y="30" width="40" height="34"/><text x="640" y="52">CF</text>
  </g>
  <text class="d-small" x="20" y="82">*Bits marked X are undefined.</text>
  <g class="d-line" style="stroke-width:1.3">
    <line x1="200" y1="66" x2="200" y2="110"/><line x1="240" y1="66" x2="240" y2="150"/><line x1="280" y1="66" x2="280" y2="190"/>
    <line x1="320" y1="66" x2="320" y2="240"/><line x1="360" y1="66" x2="360" y2="300"/><line x1="400" y1="66" x2="400" y2="260"/>
    <line x1="480" y1="66" x2="480" y2="220"/><line x1="560" y1="66" x2="560" y2="170"/><line x1="640" y1="66" x2="640" y2="120"/>
  </g>
  <g style="font-family:var(--font-body);font-size:17px">
    <text x="194" y="124" text-anchor="end" class="d-t-acc-2" style="fill:var(--d-accent-2)">Overflow</text>
    <text x="234" y="164" text-anchor="end" class="d-text" style="font-size:17px">Direction</text>
    <text x="274" y="204" text-anchor="end" class="d-text" style="font-size:17px">Interrupt enable</text>
    <text x="314" y="254" text-anchor="end" class="d-text" style="font-size:17px">Trap</text>
    <text x="360" y="320" text-anchor="middle" style="fill:var(--d-accent-2)">Sign</text>
    <text x="408" y="276" style="fill:var(--d-accent-2)">Zero</text>
    <text x="488" y="234" style="fill:var(--d-accent-2)">Auxiliary flag</text>
    <text x="568" y="184" style="fill:var(--d-accent-2)">Parity flag</text>
    <text x="648" y="134" text-anchor="end" style="fill:var(--d-accent-2)" transform="translate(-6 0)">Carry flag</text>
  </g>
  <text x="20" y="360" style="font-family:var(--font-body);font-size:17px;fill:var(--d-accent-2)">6 are status flags</text>
  <text x="20" y="386" class="d-text" style="font-size:17px">3 are control flag</text>
</svg>
