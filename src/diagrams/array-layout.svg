<text class="d-label" x="560" y="68.0" text-anchor="start" dominant-baseline="central">offset nums + k × 2</text>
<text class="d-caps" x="40" y="182.0" text-anchor="start" dominant-baseline="central">2-D ARRAY  3 × 4 BYTES, ROW-MAJOR</text>
<text class="d-mono" x="65" y="220.0" text-anchor="middle" dominant-baseline="central">0,0</text>
<text class="d-mono" x="115" y="220.0" text-anchor="middle" dominant-baseline="central">0,1</text>
