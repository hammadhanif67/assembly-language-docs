<text class="d-caps" x="40" y="24.0" text-anchor="start" dominant-baseline="central">WORD ARRAY   nums dw 10, 20, 30, 40</text>
<text class="d-mono" x="70" y="60.0" text-anchor="middle" dominant-baseline="central">0A</text>
<text class="d-small" x="70" y="94.0" text-anchor="middle" dominant-baseline="central">+0</text>
<text class="d-mono" x="130" y="60.0" text-anchor="middle" dominant-baseline="central">00</text>
<text class="d-small" x="130" y="94.0" text-anchor="middle" dominant-baseline="central">+1</text>
<text class="d-mono" x="190" y="60.0" text-anchor="middle" dominant-baseline="central">14</text>
<text class="d-small" x="190" y="94.0" text-anchor="middle" dominant-baseline="central">+2</text>
<text class="d-mono" x="250" y="60.0" text-anchor="middle" dominant-baseline="central">00</text>
<text class="d-small" x="250" y="94.0" text-anchor="middle" dominant-baseline="central">+3</text>
