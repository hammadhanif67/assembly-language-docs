<text class="d-mono" x="615" y="220.0" text-anchor="middle" dominant-baseline="central">2,3</text>
<text class="d-mono" x="40" y="264.0" text-anchor="start" dominant-baseline="central">address of [row][col] = base + (row × columns + col) × element size</text>
<text class="d-small" x="40" y="288.0" text-anchor="start" dominant-baseline="central">example: [1][2] = base + (1 × 4 + 2) × 1 = base + 6</text>
