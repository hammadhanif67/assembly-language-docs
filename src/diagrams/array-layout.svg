<text class="d-mono" x="430" y="60.0" text-anchor="middle" dominant-baseline="central">28</text>
<text class="d-small" x="430" y="94.0" text-anchor="middle" dominant-baseline="central">+6</text>
<text class="d-mono" x="490" y="60.0" text-anchor="middle" dominant-baseline="central">00</text>
<text class="d-small" x="490" y="94.0" text-anchor="middle" dominant-baseline="central">+7</text>
