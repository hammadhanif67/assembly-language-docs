<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg">
  <g class="d-text" style="font-size:13px">
    <rect class="d-box-2" x="20" y="180" width="110" height="50" rx="4"/><text class="d-title" x="75" y="201" text-anchor="middle">Step 1</text><text class="d-small" x="75" y="219" text-anchor="middle" style="fill:var(--d-text)">fetch instruction</text>
    <rect class="d-box-2" x="150" y="140" width="110" height="90" rx="4"/><text class="d-title" x="205" y="161" text-anchor="middle">Step 2</text><text class="d-small" x="205" y="179" text-anchor="middle" style="fill:var(--d-text)">read registers</text><text class="d-small" x="205" y="194" text-anchor="middle" style="fill:var(--d-text)">&amp; decode</text>
    <rect class="d-box-2" x="280" y="100" width="110" height="130" rx="4"/><text class="d-title" x="335" y="121" text-anchor="middle">Step 3</text><text class="d-small" x="335" y="139" text-anchor="middle" style="fill:var(--d-text)">execute or</text><text class="d-small" x="335" y="154" text-anchor="middle" style="fill:var(--d-text)">calculate address</text>
    <rect class="d-box-3" x="410" y="60" width="110" height="170" rx="4"/><text class="d-title" x="465" y="81" text-anchor="middle">Step 4</text><text class="d-small" x="465" y="99" text-anchor="middle" style="fill:var(--d-text)">access operand</text><text class="d-small" x="465" y="114" text-anchor="middle" style="fill:var(--d-text)">in data memory</text>
    <rect class="d-box-a" x="540" y="20" width="110" height="210" rx="4"/><text class="d-title d-on-accent" x="595" y="41" text-anchor="middle">Step 5</text><text class="d-small" x="595" y="59" text-anchor="middle" style="fill:var(--on-accent)">write result</text><text class="d-small" x="595" y="74" text-anchor="middle" style="fill:var(--on-accent)">into a register</text>
  </g>
  <path class="d-line d-arrow d-acc-2" style="marker-end:url(#d-ah-acc2)" d="M75 170 Q140 120 200 128"/>
  <path class="d-line d-arrow d-acc-2" style="marker-end:url(#d-ah-acc2)" d="M205 130 Q270 80 330 88"/>
  <path class="d-line d-arrow d-acc-2" style="marker-end:url(#d-ah-acc2)" d="M335 90 Q400 40 460 48"/>
  <path class="d-line d-arrow d-acc-2" style="marker-end:url(#d-ah-acc2)" d="M465 50 Q520 8 560 12"/>
</svg>
