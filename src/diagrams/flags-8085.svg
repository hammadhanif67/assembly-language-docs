<text class="d-mono d-on-accent" x="130" y="56.0" text-anchor="middle" dominant-baseline="central">Z</text>
<text class="d-small" x="130" y="96.0" text-anchor="middle" dominant-baseline="central">Zero</text>
<text class="d-small" x="190" y="22.0" text-anchor="middle" dominant-baseline="central">D5</text>
<text class="d-mono" x="190" y="56.0" text-anchor="middle" dominant-baseline="central">-</text>
<text class="d-small" x="250" y="22.0" text-anchor="middle" dominant-baseline="central">D4</text>
<text class="d-mono d-on-accent" x="250" y="56.0" text-anchor="middle" dominant-baseline="central">AC</text>
<text class="d-small" x="250" y="96.0" text-anchor="middle" dominant-baseline="central">Aux. carry</text>
<text class="d-small" x="310" y="22.0" text-anchor="middle" dominant-baseline="central">D3</text>
<text class="d-mono" x="310" y="56.0" text-anchor="middle" dominant-baseline="central">-</text>
<text class="d-small" x="370" y="22.0" text-anchor="middle" dominant-baseline="central">D2</text>
