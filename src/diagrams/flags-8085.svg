<text class="d-small" x="40" y="130.5" text-anchor="start" dominant-baseline="central">Cells marked - are unused bits.</text>
<text class="d-small" x="40" y="145.5" text-anchor="start" dominant-baseline="central">The ALU sets these five flags after arithmetic and logic operations.</text>
