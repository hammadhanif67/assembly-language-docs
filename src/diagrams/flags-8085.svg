<text class="d-small" x="370" y="96.0" text-anchor="middle" dominant-baseline="central">Parity</text>
<text class="d-small" x="430" y="22.0" text-anchor="middle" dominant-baseline="central">D1</text>
<text class="d-mono" x="430" y="56.0" text-anchor="middle" dominant-baseline="central">-</text>
<text class="d-small" x="490" y="22.0" text-anchor="middle" dominant-baseline="central">D0</text>
