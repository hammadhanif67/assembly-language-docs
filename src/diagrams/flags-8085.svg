<text class="d-small" x="70" y="22.0" text-anchor="middle" dominant-baseline="central">D7</text>
<text class="d-mono d-on-accent" x="70" y="56.0" text-anchor="middle" dominant-baseline="central">S</text>
<text class="d-small" x="70" y="96.0" text-anchor="middle" dominant-baseline="central">Sign</text>
