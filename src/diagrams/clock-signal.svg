<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg">
  <text class="d-small" x="400" y="26" text-anchor="middle">One Clock</text>
  <text class="d-small" x="400" y="42" text-anchor="middle">“Period”</text>
  <line class="d-line d-arrow-both" x1="352" y1="56" x2="448" y2="56"/>
  <line class="d-line d-dot" x1="352" y1="50" x2="352" y2="90"/>
  <line class="d-line d-dot" x1="448" y1="50" x2="448" y2="90"/>
  <text class="d-mono" x="88" y="96" text-anchor="end">1</text>
  <text class="d-mono" x="88" y="146" text-anchor="end">0</text>
  <path class="d-line d-acc" style="stroke-width:2.4" d="M100 140 H160 V90 H208 V140 H256 V90 H304 V140 H352 V90 H400 V140 H448 V90 H496 V140 H544 V90 H592 V140"/>
  <text class="d-title" x="60" y="40" text-anchor="start" style="font-size:13px">Rising Edge</text>
